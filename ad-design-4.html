<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hjälparen - Design 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
            color: white;
        }

        .container {
            padding: 4rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .main-headline {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .emoji-large {
            font-size: 6rem;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .features-box {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 3rem;
            margin-bottom: 3rem;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .features-box h3 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            text-align: left;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .feature-icon {
            font-size: 2rem;
        }

        .price-section {
            background: white;
            color: #667eea;
            border-radius: 30px;
            padding: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .price-label {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .price {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: #764ba2;
        }

        .price-unit {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .cta {
            background: white;
            color: #667eea;
            padding: 1.8rem 3rem;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: float 6s infinite;
        }

        .bubble-1 {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .bubble-2 {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .bubble-3 {
            width: 100px;
            height: 100px;
            bottom: 15%;
            left: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        @media print {
            body {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">🤝 Hjälparen</div>
        </div>
        
        <div class="main-content">
            <div class="emoji-large">✨</div>
            <h1 class="main-headline">Släpp taget om städningen!<br>Vi fixar allt åt dig</h1>
            
            <div class="features-box">
                <h3>Allt ingår - inga dolda kostnader!</h3>
                <div class="features-grid">
                    <div class="feature">
                        <span class="feature-icon">🧹</span>
                        <span>Grundlig städning</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🪟</span>
                        <span>Fönsterputs</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">💧</span>
                        <span>Djuprengöring</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">✨</span>
                        <span>Alla jobbiga sysslor</span>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="price-section">
                <div class="price-label">Endast</div>
                <div class="price">299</div>
                <div class="price-unit">kr/timme</div>
            </div>
            
            <div class="cta">
                Boka nu på hjälparen.se
            </div>
        </div>
    </div>
</body>
</html>
