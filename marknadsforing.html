<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marknadsföringsbilder - Hjälparen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .ad-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .ad-card:hover {
            transform: translateY(-5px);
        }

        .ad-card h3 {
            padding: 1rem;
            background: #ff6b35;
            color: white;
            text-align: center;
            font-size: 1.1rem;
        }

        .ad-preview {
            width: 100%;
            height: 600px;
            border: none;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #ff8555;
        }

        @media print {
            body {
                padding: 0;
            }
            .ad-card {
                page-break-inside: avoid;
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Marknadsföringsbilder - Hjälparen Städtjänster</h1>
        
        <div class="ads-grid">
            <div class="ad-card">
                <h3>Design 1: Modern & Minimalistisk</h3>
                <iframe src="ad-design-1.html" class="ad-preview"></iframe>
                <button class="download-btn" onclick="window.open('ad-design-1.html', '_blank')">Öppna i ny flik för nedladdning</button>
            </div>

            <div class="ad-card">
                <h3>Design 2: Färgglad & Energisk</h3>
                <iframe src="ad-design-2.html" class="ad-preview"></iframe>
                <button class="download-btn" onclick="window.open('ad-design-2.html', '_blank')">Öppna i ny flik för nedladdning</button>
            </div>

            <div class="ad-card">
                <h3>Design 3: Elegant & Premium</h3>
                <iframe src="ad-design-3.html" class="ad-preview"></iframe>
                <button class="download-btn" onclick="window.open('ad-design-3.html', '_blank')">Öppna i ny flik för nedladdning</button>
            </div>

            <div class="ad-card">
                <h3>Design 4: Vänlig & Inbjudande</h3>
                <iframe src="ad-design-4.html" class="ad-preview"></iframe>
                <button class="download-btn" onclick="window.open('ad-design-4.html', '_blank')">Öppna i ny flik för nedladdning</button>
            </div>

            <div class="ad-card">
                <h3>Design 5: Professionell & Tillförlitlig</h3>
                <iframe src="ad-design-5.html" class="ad-preview"></iframe>
                <button class="download-btn" onclick="window.open('ad-design-5.html', '_blank')">Öppna i ny flik för nedladdning</button>
            </div>
        </div>
    </div>
</body>
</html>
