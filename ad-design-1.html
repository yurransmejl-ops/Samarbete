<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hjälparen - Design 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
            color: white;
        }

        .container {
            padding: 4rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .main-headline {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subheadline {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 3rem;
            opacity: 0.95;
        }

        .features {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .features h3 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .feature-list {
            list-style: none;
            font-size: 1.4rem;
            line-height: 2;
        }

        .feature-list li {
            padding-left: 2rem;
            position: relative;
        }

        .feature-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            font-weight: 700;
            color: #ffd700;
        }

        .price-box {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .price {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .price-label {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        .cta {
            background: #ff6b35;
            color: white;
            padding: 1.5rem 3rem;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,107,53,0.4);
            transition: transform 0.3s;
        }

        .cta:hover {
            transform: scale(1.05);
        }

        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            top: -200px;
            right: -200px;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -150px;
        }

        @media print {
            body {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="decorative-circle circle-1"></div>
    <div class="decorative-circle circle-2"></div>
    
    <div class="container">
        <div class="logo">🤝 Hjälparen</div>
        
        <div>
            <h1 class="main-headline">Få ditt hem skinande rent</h1>
            <p class="subheadline">Professionell städning som passar dig</p>
            
            <div class="features">
                <h3>Allt ingår:</h3>
                <ul class="feature-list">
                    <li>Grundlig städning</li>
                    <li>Fönsterputs</li>
                    <li>Djuprengöring</li>
                    <li>Alla jobbiga sysslor</li>
                </ul>
            </div>
        </div>

        <div>
            <div class="price-box">
                <div class="price">299 kr</div>
                <div class="price-label">per timme</div>
            </div>
            
            <div class="cta">
                Boka nu på hjälparen.se
            </div>
        </div>
    </div>
</body>
</html>
